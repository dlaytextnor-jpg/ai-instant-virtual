<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instant Virtuals AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 28px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #202020;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: bold;
  font-style: italic;
}

.badge {
  background: linear-gradient(#ff7777, #f00016, #a80010);
  border: 1px solid #ff7777;
  border-radius: 16px;
  padding: 15px 12px;
  box-shadow: 0 0 20px #ff001533;
}

.logo span {
  color: #ff2438;
}

.home {
  color: #ffd35b;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 65px 22px 35px;
}

.eyebrow {
  color: #ffd15a;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 4px;
}

h1 {
  text-align: center;
  font-size: 35px;
  margin: 22px 0;
}

.subtitle {
  text-align: center;
  color: #aaa8b3;
  line-height: 1.6;
  font-size: 16px;
  margin-bottom: 55px;
}

.card {
  background: linear-gradient(145deg, #151515, #101010);
  border: 1px solid #343434;
  border-radius: 25px;
  padding: 28px 22px;
  box-shadow: 0 15px 40px #ff00100d;
}

label {
  display: block;
  font-weight: bold;
  margin: 0 0 10px;
}

input {
  width: 100%;
  padding: 18px;
  margin-bottom: 28px;
  background: #202020;
  color: white;
  border: 1px solid #383838;
  border-radius: 22px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #ff2638;
}

button {
  width: 100%;
  border: none;
  border-radius: 22px;
  padding: 19px;
  color: white;
  background: linear-gradient(#ff3039, #ec000b);
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 28px #ff001733;
}

.switch {
  text-align: center;
  color: #aaa8b3;
  margin-top: 38px;
  line-height: 1.8;
}

.switch a {
  color: #ffd15a;
  text-decoration: none;
  font-weight: bold;
}

.message {
  margin-top: 18px;
  color: #ffd15a;
  text-align: center;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="badge">IV</div>
    <div>INSTANT <span>VIRTUALS</span></div>
  </div>
  <a class="home" href="index.html">Back to home</a>
</header>

<main>
  <div class="eyebrow">INSTANT VIRTUALS · PREDICTIONS</div>

  <h1 id="heading">Welcome back</h1>

  <p class="subtitle" id="subtitle">
    Sign in to access Virtuals AI and your predictions.
  </p>

  <div class="card">
    <form id="authForm">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button type="submit" id="submitBtn">Sign in</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <div class="switch">
    <span id="switchText">Don't have an account?</span>
    <a href="#" id="switchLink">Sign up</a>
  </div>
</main>

<footer>
  INSTANT VIRTUALS AI · Football predictions for information only.
</footer>

<script>
let isSignup = false;

const form = document.getElementById("authForm");
const heading = document.getElementById("heading");
const subtitle = document.getElementById("subtitle");
const submitBtn = document.getElementById("submitBtn");
const switchText = document.getElementById("switchText");
const switchLink = document.getElementById("switchLink");
const message = document.getElementById("message");

switchLink.addEventListener("click", function(event) {
  event.preventDefault();

  isSignup = !isSignup;

  heading.textContent = isSignup ? "Create account" : "Welcome back";

  subtitle.textContent = isSignup
    ? "Create your account to explore Virtuals AI."
    : "Sign in to access Virtuals AI and your predictions.";

  submitBtn.textContent = isSignup ? "Sign up" : "Sign in";

  switchText.textContent = isSignup
    ? "Already have an account?"
    : "Don't have an account?";

  switchLink.textContent = isSignup ? "Sign in" : "Sign up";

  message.textContent = "";
});

form.addEventListener("submit", function(event) {
  event.preventDefault();

  message.textContent =
    "The design is ready! Connect a secure authentication service to enable real accounts.";
});
</script>
<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
  "https://ygkkwepdatmbywsmktup.supabase.co";

// Replace this text with your Supabase publishable key.
const SUPABASE_PUBLISHABLE_KEY =
  "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let isSignup = false;

const form = document.getElementById("authForm");
const heading = document.getElementById("heading");
const subtitle = document.getElementById("subtitle");
const submitBtn = document.getElementById("submitBtn");
const switchText = document.getElementById("switchText");
const switchLink = document.getElementById("switchLink");
const message = document.getElementById("message");

switchLink.addEventListener("click", (event) => {
  event.preventDefault();

  isSignup = !isSignup;

  heading.textContent = isSignup
    ? "Create account"
    : "Welcome back";

  subtitle.textContent = isSignup
    ? "Create your account to explore Virtuals AI."
    : "Sign in to access Virtuals AI and your predictions.";

  submitBtn.textContent = isSignup ? "Sign up" : "Sign in";

  switchText.textContent = isSignup
    ? "Already have an account?"
    : "Don't have an account?";

  switchLink.textContent = isSignup ? "Sign in" : "Sign up";

  message.textContent = "";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  submitBtn.disabled = true;
  message.textContent = "Please wait...";

  try {
    if (isSignup) {
      const { data, error } = await supabase.auth.signUp({
        email,
        password
      });

      if (error) throw error;

      message.textContent = data.session
        ? "Account created successfully! You are signed in."
        : "Account created! Check your email to confirm your account.";
    } else {
      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      message.textContent = "Sign in successful! Your account is connected.";
    }
  } catch (error) {
    message.textContent = error.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
"PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";
